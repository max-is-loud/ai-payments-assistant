[project]
name = "ai-payments-assistant"
version = "0.1.0"
description = "AI assistant over a Stripe account: owner web app, customer Telegram bot, seed script."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52,<1",
  "sse-starlette>=3.4,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy>=2.0.52,<3",
  "stripe>=15.6,<16",
  "anthropic>=1.3,<2",
  "openai>=3.6,<4",
  "python-telegram-bot>=22.8,<23",
  "faker>=40,<41",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_llm: calls a real LLM; deselected by default, needs a key"]
addopts = "-m 'not live_llm'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
