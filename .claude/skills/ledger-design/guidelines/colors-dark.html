<!-- @dsCard group="Colors" viewport="700x150" name="Dark theme" subtitle="Same tokens under [data-theme=dark]" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Dark theme</title><link rel="stylesheet" href="../../styles.css"></head><body style="padding:20px;background:var(--paper)"><div data-theme="dark" style="background:var(--paper);padding:16px;border-radius:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;color:var(--ink)"><div><div style="height:56px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--paper</div><div style="font-size:12px;color:var(--ink-3)"></div></div><div><div style="height:56px;border-radius:8px;background:var(--card);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--card</div><div style="font-size:12px;color:var(--ink-3)"></div></div><div><div style="height:56px;border-radius:8px;background:var(--ink);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--ink</div><div style="font-size:12px;color:var(--ink-3)"></div></div><div><div style="height:56px;border-radius:8px;background:var(--in);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--in</div><div style="font-size:12px;color:var(--ink-3)"></div></div><div><div style="height:56px;border-radius:8px;background:var(--out);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--out</div><div style="font-size:12px;color:var(--ink-3)"></div></div><div><div style="height:56px;border-radius:8px;background:var(--wait);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--wait</div><div style="font-size:12px;color:var(--ink-3)"></div></div></div></body></html>
