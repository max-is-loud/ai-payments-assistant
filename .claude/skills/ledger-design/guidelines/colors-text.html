<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Text ladder</title><link rel="stylesheet" href="../../styles.css"></head><body style="padding:20px;background:var(--paper)"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div><div style="height:56px;border-radius:8px;background:var(--ink);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--ink</div><div style="font-size:12px;color:var(--ink-3)">body · headings · figures</div></div><div><div style="height:56px;border-radius:8px;background:var(--ink-2);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--ink-2</div><div style="font-size:12px;color:var(--ink-3)">secondary copy · trail lines</div></div><div><div style="height:56px;border-radius:8px;background:var(--ink-3);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--ink-3</div><div style="font-size:12px;color:var(--ink-3)">eyebrows · meta · axes</div></div></div></body></html>
