<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Green in, coral out, amber waiting — each with a soft fill" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../../styles.css"></head><body style="padding:20px;background:var(--paper)"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div><div style="height:56px;border-radius:8px;background:var(--in);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--in</div><div style="font-size:12px;color:var(--ink-3)">money in · success</div></div><div><div style="height:56px;border-radius:8px;background:var(--in-soft);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--in-soft</div><div style="font-size:12px;color:var(--ink-3)"></div></div><div><div style="height:56px;border-radius:8px;background:var(--out);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--out</div><div style="font-size:12px;color:var(--ink-3)">money out · error</div></div><div><div style="height:56px;border-radius:8px;background:var(--out-soft);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--out-soft</div><div style="font-size:12px;color:var(--ink-3)"></div></div><div><div style="height:56px;border-radius:8px;background:var(--wait);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--wait</div><div style="font-size:12px;color:var(--ink-3)">needs approval</div></div><div><div style="height:56px;border-radius:8px;background:var(--wait-soft);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--wait-soft</div><div style="font-size:12px;color:var(--ink-3)"></div></div></div></body></html>
