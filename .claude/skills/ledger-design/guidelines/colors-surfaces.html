<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & ink" subtitle="Warm paper, stepped card, ink band, hairlines" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces & ink</title><link rel="stylesheet" href="../../styles.css"></head><body style="padding:20px;background:var(--paper)"><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div><div style="height:56px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--paper</div><div style="font-size:12px;color:var(--ink-3)">page</div></div><div><div style="height:56px;border-radius:8px;background:var(--card);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--card</div><div style="font-size:12px;color:var(--ink-3)">raised</div></div><div><div style="height:56px;border-radius:8px;background:var(--band);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--band</div><div style="font-size:12px;color:var(--ink-3)">masthead</div></div><div><div style="height:56px;border-radius:8px;background:var(--rule);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--rule</div><div style="font-size:12px;color:var(--ink-3)">hairline</div></div><div><div style="height:56px;border-radius:8px;background:var(--bar);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--bar</div><div style="font-size:12px;color:var(--ink-3)">muted bars</div></div><div><div style="height:56px;border-radius:8px;background:var(--ink);border:1px solid var(--rule)"></div><div class="ldg-mono" style="font-size:11px;margin-top:6px;color:var(--ink-2)">--ink</div><div style="font-size:12px;color:var(--ink-3)">ink</div></div></div></body></html>
